name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "npm"
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # standalone 出力を「展開してそのまま実行できる」ディレクトリ構成に組み立てる。
      # (.next/static と public は standalone 配下に配置しないと配信されない)
      - name: Assemble runnable standalone bundle
        run: |
          mkdir -p dist
          cp -r .next/standalone/. dist/
          mkdir -p dist/.next
          cp -r .next/static dist/.next/static
          cp -r public dist/public
          cp .env.sample dist/.env.sample
          cat > dist/START.md << 'EOF'
          # slimechan3 の起動方法

          この zip を展開したディレクトリで、以下を実行してください。

          1. `.env.sample` をコピーして `.env` を作成し、値を設定する
             （最低限 `SCHEDULE_XLSX_URL` が必要）

                 cp .env.sample .env

          2. Node.js (v20 以降推奨) で起動する

                 node server.js

             `.env` は server.js が自動で読み込みます。
             ただし待受ポートだけは `.env` では変わらないため、変更したい場合は

                 PORT=3001 node server.js

             のように環境変数で指定してください。

          3. ブラウザで http://localhost:3000 を開く
          EOF
      - name: Upload standalone bundle
        uses: actions/upload-artifact@v4
        with:
          name: slimechan3-standalone
          path: dist
          # .next / .env.sample などドット始まりを含めるために必須
          include-hidden-files: true
          if-no-files-found: error
